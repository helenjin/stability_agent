# Fast, deliberately-less-accurate smoke-test config -- for validating the
# pipeline produces sane, non-degenerate results end-to-end, NOT for reporting
# real TopoDev numbers. See configs/experiment.yaml for the paper-faithful
# config (epsilon=0.1, matching the paper's main ARES-epsilon0.1 setting).
#
# Only difference from experiment.yaml: ARES's epsilon relaxed 0.1 -> 0.3.
# Per the paper's own ablation (Table 3), this drops samples/step from ~265 to
# ~30 (~9x fewer calls) with "no significant difference" in reported
# performance on ClaimTrees/CaptainCookRecipes specifically -- so it's a
# reasonable dial for "does this work at all" before spending real budget on
# the faithful config's full sample count.

dataset: captaincookrecipes
recipe_data_dir: ares_topodev/vendor/ares/data/recipe_graphs

backbone_model: gpt-4o-mini

p: 0.95
temperature: 0.0
max_new_tokens: 1000

K: 10
seed: 42
max_topo_attempts: 200

method_configs:
  ares: cert_granular_temp0_nonexact
  entail_prev: entail_granular
  entail_base: entail_raw_granular
  roscoe_li_self: roscoe_li_self_granular
  roscoe_li_source: roscoe_li_source_granular
  receval_intra: receval_intra_correct_granular
  receval_inter: receval_inter_correct_granular
  llm_judge: llm_judge_granular

method_kwarg_overrides:
  ares:
    epsilon: 0.3

methods_to_run:
  - ares
  - entail_prev
  - entail_base

# Separate results dir so smoke-test output is never confused with a
# paper-faithful (epsilon=0.1) run's results.
results_dir: ares_topodev/results_smoketest
cache_path: ares_topodev/results_smoketest/cache/llm_prompt_cache.jsonl

raw_claims_shuffle_idx: 0
