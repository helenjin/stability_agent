[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stability-agent"
version = "0.1.0"
description = "Analyze soft-stability outputs and surface low-vs-high reasoning patterns."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
compute = ["torch"]

[project.scripts]
stability-agent = "stability_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stability_agent*"]
